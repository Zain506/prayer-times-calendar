name: Build prayer-time calendar

on:
  schedule:
    - cron: "17 3 * * 1"   # every Monday 03:17 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:                     # rebuild on every push to main
    branches: [main]
    paths-ignore: [docs/prayer-times.ics]  # the rebuild's own commit

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch timetable and build .ics
        run: |
          mkdir -p docs
          python make_ics.py \
            --url "https://islamiccentreedgware.org/wp-json/dpt/v1/prayertime?filter=download_timetable" \
            --from "$(date -u -d '7 days ago' +%F)" \
            -o docs/prayer-times.ics

      - name: Commit if changed
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs/prayer-times.ics
          git diff --cached --quiet || git commit -m "Update prayer times $(date -u +%F)"
          git push
